name: interference
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - numpy
  - scipy
  - scikit-learn
  - pandas
  - matplotlib
  - prettytable
  - pip
  - pip:
      - torch --index-url https://download.pytorch.org/whl/cu121  # CUDA 12.1; use cu118 for older GPUs, or just 'torch' for CPU-only
      - pymatgen
      - matminer
      - mp-api          # optional: only needed for download_mp_current.py
